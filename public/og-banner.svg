<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14120f"/>
      <stop offset="100%" style="stop-color:#1a1714"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4953a"/>
      <stop offset="100%" style="stop-color:#e8a84c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="150" x2="1200" y2="150" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="450" x2="1200" y2="450" stroke="#fff" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#fff" stroke-width="0.5"/>
  </g>

  <!-- Accent line -->
  <rect x="100" y="420" width="80" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Main content -->
  <text x="100" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="600" fill="#ffffff">Muhammad Zain</text>

  <text x="100" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#a1a1aa">Agentic AI Developer</text>

  <text x="100" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#71717a">Accounting &amp; Finance | Bahria University Karachi</text>

  <!-- Bottom tagline -->
  <text x="100" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#d4953a" letter-spacing="2">BUILDING INTELLIGENT AI AGENTS</text>

  <!-- Monogram watermark -->
  <text x="950" y="380" font-family="Georgia, 'Times New Roman', serif" font-size="180" font-weight="500" fill="#ffffff" opacity="0.03" text-anchor="end">MZ</text>

  <!-- Decorative accent circle -->
  <circle cx="1050" cy="150" r="60" fill="none" stroke="#d4953a" stroke-width="1" opacity="0.2"/>
  <circle cx="1050" cy="150" r="40" fill="none" stroke="#d4953a" stroke-width="0.5" opacity="0.1"/>
</svg>
